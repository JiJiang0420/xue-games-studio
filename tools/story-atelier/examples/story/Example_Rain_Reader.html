<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨停之前 · 阅读版</title><style>body{margin:0;background:#f3f0e7;color:#324337;font:17px/2 'Songti SC',SimSun,serif}main{max-width:720px;margin:25px auto;background:#fffcf2;padding:36px 45px;border:1px solid #ddd9c9}header{display:flex;justify-content:space-between;gap:12px;font:12px sans-serif;color:#778371}h1{text-align:center;font-size:28px;font-weight:400;margin:40px 0}article{white-space:pre-wrap}button{font:14px sans-serif;padding:13px;background:transparent;border:1px solid #a2ae98;color:inherit;border-radius:5px;cursor:pointer;margin:12px 5px 0 0}#choices button{display:block;width:100%;text-align:left}small{color:#818976}footer{margin-top:35px;padding-top:20px;border-top:1px solid #ddd9c9}body.dark{background:#222d29;color:#dce1d6}body.dark main{background:#28372e;border-color:#53624b}@media(max-width:600px){main{margin:0;padding:25px}}</style></head><body><main><header><span id="book"></span><button id="theme">切换明暗</button></header><h1 id="title"></h1><article id="text"></article><div id="choices"></div><footer><button id="back">返回</button><button id="restart">重新开始</button><small id="progress"></small></footer></main><script>const book={"title":"雨停之前","type":"分支互动剧情","chapters":[{"id":"ch-rain","title":"第一章 · 最后一盏灯","text":"雨落在站台的铁皮棚上，声音比广播还响。\n\n林禾把工具箱放在长椅下，卷起湿透的袖口。头顶的灯闪了两下，彻底灭了。售票窗里，周伯划亮一根火柴，替那盏从未用过的煤油灯点上火。\n\n“备用电池在哪儿？”林禾问。\n\n周伯指了指墙角。柜子上还贴着十年前的值班表，红笔画过的名字大半已经褪色。她拉开最下面一格，找到电池，也找到一个皱巴巴的信封。封面写着：等关站那天再读。\n\n“你写的？”\n\n“旅客写的。收了太多，没舍得扔。”\n\n她把电池接到检测器上。剩余电量，只够带起一台设备。站台外的台阶没有灯，最后一班车的旅客要踩着积水进来；广播机里还存着历年乘客留下的录音，今晚停电后，那台老机器也许再启动不了。\n\n周伯把煤油灯推到她手边，没有替她拿主意。\n\n“我去门口接人。”他说，“你修你觉得该修的。”\n\n林禾看着电池上那格发绿的刻度。她原以为修理是一件简单的事：找到坏处，再换一个零件。现在她知道，有些问题没有备用零件。","choices":[{"label":"先照亮站台，让旅客安全进站","target":"ch-light"},{"label":"启动广播，留下大家的声音","target":"ch-voice"}]},{"id":"ch-light","title":"第二章 · 把路照亮","text":"灯亮的时候，雨仍然没有停。\n\n一小片暖光落在台阶上，把积水照得透亮。周伯站在光的边缘，扶着一个提菜篮的老太太进门。老太太抬头看了一眼，说这盏灯比从前亮了。\n\n林禾没有解释。她知道广播机已经失去最后一次启动的机会。修好的东西摆在眼前，没能留下的东西却像细小的砂子，硌在心里。\n\n列车缓缓靠站。周伯拿出那个信封，摊开里面厚厚的一叠纸。\n\n“声音没了，字还在。”他说，“有人写：那年忘带车费，是你替我垫的。也有人写：别总喝凉水。”\n\n林禾笑了，鼻尖却发酸。她从工具箱里抽出一张维修单，在背面写：今天的灯，由林禾修好。写完，她又划掉后半句，改成：今天，大家都平安上了车。\n\n关门之前，她回头看了一次。站台上没有人，灯依然亮着。明天它会熄灭，但今晚，那段路已经被照过了。","choices":[]},{"id":"ch-voice","title":"第三章 · 声音留下来","text":"广播机吐出一阵沙沙声。\n\n“试一下，听得见吗？”\n\n声音里的周伯比现在年轻，带着点不好意思的笑。林禾按下录音键，把手机靠近喇叭。随后出现的是一个孩子唱了一半的歌、一名旅客寻找丢失手套的留言，还有一句没有姓名的谢谢。\n\n门外有人踩空。周伯立刻提起煤油灯走出去，林禾也放下螺丝刀，跟在他身后。雨打得灯罩发白，两人一前一后，慢慢把三位旅客引进候车室。她的鞋里灌满了水。\n\n最后一段声音播放时，列车进了站。那是一阵很长的安静，后来有人轻声说：“到家给我打电话。”\n\n林禾把录音存好，给文件起名：车站，最后一天。她没有给它加音乐。\n\n周伯吹灭煤油灯，锁好门。他把钥匙收进口袋，走了两步，又拿出来放回窗台。\n\n“明天不用来了。”他说。\n\n林禾把耳机的一端递给他。两个人站在雨棚下面，重新听了一遍那个没唱完的歌。","choices":[]}]};let index=0,history=[];function render(){const c=book.chapters[index];document.getElementById('book').textContent=book.title;document.getElementById('title').textContent=c?.title||'暂无章节';document.getElementById('text').textContent=c?.text||'';document.getElementById('progress').textContent=' 节点 '+(index+1)+' / '+book.chapters.length;const box=document.getElementById('choices');box.replaceChildren();function choice(label,target){const b=document.createElement('button');b.textContent=label+' →';b.onclick=()=>{if(target<0)return;history.push(index);index=target;render();scrollTo(0,0)};box.append(b)}if(c?.choices.length)c.choices.forEach(x=>choice(x.label,book.chapters.findIndex(t=>t.id===x.target)));else if(book.type!=='分支互动剧情'&&index<book.chapters.length-1)choice('下一章',index+1);else{const end=document.createElement('p');end.textContent='— 此篇完 —';box.append(end)}document.getElementById('back').disabled=!history.length}document.getElementById('back').onclick=()=>{if(history.length){index=history.pop();render();scrollTo(0,0)}};document.getElementById('restart').onclick=()=>{index=0;history=[];render();scrollTo(0,0)};document.getElementById('theme').onclick=()=>document.body.classList.toggle('dark');render();</script></body></html>
